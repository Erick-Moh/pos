{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Trebuchet MS', Trebuchet, Arial, sans-serif;
        }
        .error-card {
            background: white; border-radius: 16px;
            padding: 48px 40px; max-width: 480px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center;
        }
        .error-code { font-size: 5rem; font-weight: 800; color: #e2e8f0; line-height: 1; margin-bottom: 8px; }
        .error-title { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
        .error-message { font-size: 14px; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
        .btn-home {
            background: #10b981; color: white; border: none;
            border-radius: 10px; padding: 10px 28px;
            font-size: 14px; font-weight: 600; text-decoration: none;
            display: inline-block; transition: filter .2s;
        }
        .btn-home:hover { filter: brightness(1.08); color: white; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code">404</div>
    <div class="error-title">Page not found</div>
    <div class="error-message">
        The page you're looking for doesn't exist or has been moved.
    </div>
    <a href="/" class="btn-home"><i class="bi bi-house me-1"></i>Back to Home</a>
</div>
</body>
</html>
