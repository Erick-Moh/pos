{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Trebuchet MS', Trebuchet, Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-card { max-width: 500px; text-align: center; padding: 3rem 2rem; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code">500</div>
    <h2 class="fw-bold mt-2 mb-3">Server Error</h2>
    <p class="text-muted mb-4">
        Something went wrong on our end. Please try again, or contact your system administrator.
    </p>
    <div class="d-flex gap-2 justify-content-center">
        <a href="/" class="btn btn-danger px-4">
            <i class="bi bi-house me-2"></i>Go Home
        </a>
        <button onclick="location.reload()" class="btn btn-outline-secondary px-4">
            <i class="bi bi-arrow-clockwise me-2"></i>Retry
        </button>
    </div>
</div>
</body>
</html>
